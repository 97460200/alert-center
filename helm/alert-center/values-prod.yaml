global:
  imageRegistry: "registry.cn-hangzhou.aliyuncs.com"
  imagePullSecrets: []
  namespace: alert-center

# 数据库配置
mysql:
  enabled: true
  auth:
    rootPassword: alertcenter123
    database: alert_center
    username: alert
    password: alert123
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Redis配置
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

# Kafka配置
kafka:
  enabled: true
  auth:
    clientProtocol: plaintext
    interBrokerProtocol: plaintext
  persistence:
    enabled: true
    size: 10Gi

# 网关服务
gateway:
  replicaCount: 2
  image:
    repository: liutools/alert-gateway
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8001
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    - name: DATABASE_URL
      value: "mysql+aiomysql://alert:alert123@mysql:3306/alert_center"
    - name: REDIS_URL
      value: "redis://redis-master:6379/0"
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: "kafka:9092"

# 处理服务
processor:
  replicaCount: 3
  image:
    repository: liutools/alert-processor
    tag: "latest"
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    - name: DATABASE_URL
      value: "mysql+aiomysql://alert:alert123@mysql:3306/alert_center"
    - name: REDIS_URL
      value: "redis://redis-master:6379/0"
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: "kafka:9092"

# 通知服务
notifier:
  replicaCount: 2
  image:
    repository: liutools/alert-notifier
    tag: "latest"
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    - name: DATABASE_URL
      value: "mysql+aiomysql://alert:alert123@mysql:3306/alert_center"
    - name: REDIS_URL
      value: "redis://redis-master:6379/0"
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: "kafka:9092"

# 管理服务
admin:
  replicaCount: 2
  image:
    repository: liutools/alert-admin
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8002
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    - name: DATABASE_URL
      value: "mysql+aiomysql://alert:alert123@mysql:3306/alert_center"
    - name: REDIS_URL
      value: "redis://redis-master:6379/0"
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: "kafka:9092"

# 前端服务
frontend:
  replicaCount: 2
  image:
    repository: liutools/alert-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  ingress:
    enabled: true
    host: alert-center.yourdomain.com
    tls: false
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/rewrite-target: /
