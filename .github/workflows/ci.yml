name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install ruff pytest pytest-asyncio
          pip install -e ./shared
          pip install -e ./services/gateway
          pip install -e ./services/processor
          pip install -e ./services/notifier
          pip install -e ./services/admin
      
      - name: Ruff 检查
        run: ruff check . --ignore E501,I001,UP035,UP007,FA100,TC001,TC002,TC003 || true
      
      - name: Python 编译检查
        run: |
          python -m compileall ./shared ./services ./migrations

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install pytest pytest-asyncio aiosqlite redis httpx
          pip install -e ./shared
          pip install -e ./services/gateway
          pip install -e ./services/processor
          pip install -e ./services/notifier
          pip install -e ./services/admin
      
      - name: 运行测试
        run: |
          pytest ./shared/tests -v --tb=short
          pytest ./services/gateway/tests -v --tb=short
          pytest ./services/processor/tests -v --tb=short
          pytest ./services/notifier/tests -v --tb=short

  build-frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 安装依赖
        working-directory: frontend
        run: npm install
      
      - name: 构建生产版本
        working-directory: frontend
        run: npm run build

  build-images:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 构建网关服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/gateway
          push: false
          tags: alert-center/gateway:${{ github.sha }}
      
      - name: 构建处理服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/processor
          push: false
          tags: alert-center/processor:${{ github.sha }}
      
      - name: 构建通知服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/notifier
          push: false
          tags: alert-center/notifier:${{ github.sha }}
      
      - name: 构建管理服务镜像
        uses: docker/build-push-action@v5
        with:
          context: ./services/admin
          push: false
          tags: alert-center/admin:${{ github.sha }}
      
      - name: 构建前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: alert-center/frontend:${{ github.sha }}
